/**:
  ros__parameters:
    pipeline_gen:
      i_pipeline_type: RGBD
      i_nn_type: rgb             # 2D detections; keep stereo depth as a separate output
      i_enable_imu: false
      i_enable_rgbd: false

    rgb:
      i_publish_topic: true
      i_low_bandwidth: true      # MJPEG is the default encoder profile
      i_publish_compressed: true

    stereo:
      i_publish_topic: true
      i_output_disparity: false  # publish depth, not disparity

    left:
      i_publish_topic: false
    right:
      i_publish_topic: false

    nn:
      i_nn_family: detection
      i_enable_passthrough: true
      i_enable_passthrough_depth: false
